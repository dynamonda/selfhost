# ytzero のバックアップ設定。/selfhost/scripts/backup.sh が読む。
#
# db/ が SQLite の WAL モード (ytzero.db-wal / -shm) なので、稼働中にコピーすると
# 壊れた状態を掴む可能性がある。停止させればクリーンシャットダウンで WAL が
# チェックポイントされるため、QUIESCE=stop にしている。
# データが育って停止時間が問題になったら QUIESCE=custom + sqlite3 .backup に移行する。

BACKUP_ENABLED=1
QUIESCE=stop

BACKUP_PATHS=(./data)

# 再生成できるものは除外する。容量より、変化の激しいキャッシュで
# 差分が膨らむのを避ける意味が大きい。
BACKUP_EXCLUDE=(
  ./data/bin        # ダウンロードされる実行ファイル (yt-dlp など)
  ./data/imgcache   # サムネイルキャッシュ
  ./data/logs
)
