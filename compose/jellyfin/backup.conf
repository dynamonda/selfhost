# jellyfin のバックアップ設定。/selfhost/scripts/backup.sh が読む。
#
# ライブラリ DB は SQLite の WAL モード (library.db-wal) なので、ytzero と同じ理由で
# QUIESCE=stop にしている。稼働中にコピーすると中途半端な状態を掴みうる。

BACKUP_ENABLED=1
QUIESCE=stop

# ./data だけ。./media は意図的に入れていない:
#   - restic リポジトリは同じ / (残り 66G) に置いてある。メディアを入れると
#     すぐ埋まるし、同一ディスクなのでディスク障害には元々備えられない。
#   - ./media/seafile は media-sync.sh が Seafile から複製しているだけなので、
#     原本は seafile 側のバックアップに入っている (二重に取らない)。
# 自前のメディアを守りたくなったら、外付けなり別リポジトリなりを用意した上で
# ここに ./media を足す。「入れ忘れ」ではなく「入れていない」ことに注意。
BACKUP_PATHS=(./data)

BACKUP_EXCLUDE=(
  ./data/cache               # サムネイル等。消えても再生成される
  ./data/config/transcodes   # トランスコードの中間ファイル
  ./data/config/log
  ./data/config/data/subtitles  # 抽出済み字幕のキャッシュ
)
