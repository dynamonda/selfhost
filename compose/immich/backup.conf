# immich のバックアップ設定。/selfhost/scripts/backup.sh が読む。
#
# PostgreSQL を稼働させたままデータディレクトリをコピーすると整合しない。
# 止めれば PostgreSQL がチェックポイントを書いてクリーンに終わるので、
# seafile と同じく QUIESCE=stop にしている (database の stop_grace_period を
# 60 秒に延ばしてあるのはこのため)。DB と写真の原本も同じ時点で揃う。
#
# Immich 自身も DB ダンプを data/library/backups/ に取る (既定で毎日 02:00)。
# これはファイルコピーより版をまたいで戻しやすいので残しておくが、そのままだと
# このバックアップの停止と時刻がぶつかる。README の初期セットアップで時刻をずらす。

BACKUP_ENABLED=1
QUIESCE=stop

# .env を含めるのは、DB パスワードがないと戻した DB に繋がらないため。
# restic リポジトリは暗号化されているので中に入れてよい。
BACKUP_PATHS=(./data ./.env)

# 消えても困らないものだけ外す。
# library/thumbs と library/encoded-video も作り直せるが、外さない。Immich は
# 起動時に各ディレクトリの .immich (目印ファイル) を確かめ、一度作ったはずのものが
# 無いと起動を拒否するので、ディレクトリごと戻らないと復元後に立ち上がらない。
BACKUP_EXCLUDE=(
  ./data/model-cache   # ML モデル。次に使うときに落とし直す
  ./data/redis         # ジョブキュー。消えても未処理ジョブがやり直しになるだけ
)
