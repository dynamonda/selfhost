# leantime のバックアップ設定。/selfhost/scripts/backup.sh が読む。
#
# MySQL を稼働させたままデータディレクトリをコピーすると、ページ単位で
# 中途半端な状態を掴む。止めれば InnoDB がクリーンシャットダウンするので、
# seafile と同じく QUIESCE=stop にしている (database の stop_grace_period を
# 60 秒に延ばしてあるのはこのため)。DB と添付ファイルも同じ時点で揃う。

BACKUP_ENABLED=1
QUIESCE=stop

# .env を含めるのは、DB パスワードがないと戻した DB に繋がらないため。
# restic リポジトリは暗号化されているので中に入れてよい。
BACKUP_PATHS=(./data ./.env)

BACKUP_EXCLUDE=(
  ./data/logs   # leantime.log。消えても困らない
)
