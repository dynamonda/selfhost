# filebrowser のバックアップ設定。/selfhost/scripts/backup.sh が読む。
#
# database.db は稼働中に書き換わる (BoltDB)。ytzero / jellyfin と同じく
# 止めてから取る。止まっている間 (数秒) はブラウザから触れないだけで影響は小さい。

BACKUP_ENABLED=1
QUIESCE=stop

# .env を含めるのは、JWT 鍵が変わると共有リンクが全部無効になるため。
# restic リポジトリは暗号化されているので中に入れてよい。
#
# 見せているホーム (/home/dynamonda) 自体はここでは取らない。filebrowser は
# 窓口でしかなく、ホームを守るかどうかはこのサービスとは別の話なので。
BACKUP_PATHS=(./data ./.env)

BACKUP_EXCLUDE=(
  ./data/tmp   # サムネイルと検索インデックス。消えても起動時に作り直される
)
