# memos のバックアップ設定。/selfhost/scripts/backup.sh が読む。
#
# memos_prod.db は WAL モードの SQLite で、稼働中は -wal / -shm と組で書き換わる。
# ファイルをそのままコピーすると噛み合わない組を掴みうるので、止めてから取る。
# SIGTERM で即座に終了する (1 秒未満) ので、止まっている時間はほぼない。

BACKUP_ENABLED=1
QUIESCE=stop

# DB とローカル保存の添付ファイルが ./data に全部ある。.env は無い。
BACKUP_PATHS=(./data)
