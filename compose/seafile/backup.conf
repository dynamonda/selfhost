# seafile のバックアップ設定。/selfhost/scripts/backup.sh が読む。
#
# MariaDB を稼働させたままデータディレクトリをコピーすると、ページ単位で
# 中途半端な状態を掴む。停止すれば InnoDB がクリーンシャットダウンするので、
# ytzero と同じく QUIESCE=stop にしている (db の stop_grace_period を 60 秒に
# 延ばしてあるのはこのため)。
# 停止時間が問題になったら QUIESCE=custom + mariadb-dump --single-transaction に
# 移行する。そのときも seafile-data/ (実ファイルの実体) は DB と整合させたいので、
# 結局 seafile 本体は止めることになる点に注意。

BACKUP_ENABLED=1
QUIESCE=stop

# .env を含めるのは、DB を戻せても JWT_PRIVATE_KEY と DB パスワードがないと
# 復旧できないため。restic リポジトリは暗号化されているので中に入れてよい。
BACKUP_PATHS=(./data ./.env)

# 再生成できるもの・その場限りのものを除外する (実際の /shared 配下の構成に対応)。
# 逆に seafile-data/storage/ はファイルの実体なので絶対に外さないこと。
BACKUP_EXCLUDE=(
  ./data/seafile/seafile/logs                    # /shared/seafile/logs
  ./data/seafile/seafile/seafile-data/httptemp   # アップロード中の一時ファイル
  ./data/seafile/seafile/seafile-data/tmpfiles   # 同上 (seahub 経由)
)
